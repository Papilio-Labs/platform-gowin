; PlatformIO Project Configuration File
;
; Example demonstrating Papilio Automatic Library Builder
; Mirrors the dual-target workflow from dev_wishbone_bus

[platformio]
default_envs = esp32, papilio_retrocade_fpga

; ==============================================================================
; ESP32-S3 Firmware Build (mirrors dev_wishbone_bus)
; ==============================================================================
[env:esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

build_flags = -I include
              -DARDUINO_USB_CDC_ON_BOOT=1
              -DBOARD_HAS_PSRAM
              -DENABLE_PAPILIO_OS

board_build.filesystem = littlefs

; Serial monitor configuration
monitor_speed = 115200
monitor_filters = colorize

; Library dependencies (override locally as needed)
lib_deps =

; Reference Papilio libraries during development
lib_extra_dirs =
    ../../../dev_wishbone_bus/libs

; ==============================================================================
; FPGA Gateware Build
; ==============================================================================
[env:papilio_retrocade_fpga]
platform = file://../../..
board = papilio_retrocade_fpga
framework = hdl

; Enable verbose output for Papilio builder
board_build.papilio_verbose = 1

; Upload protocol for FPGA bitstreams
upload_protocol = pesptool

; Library dependencies - auto-integrated by Papilio builder
lib_deps =
    papilio_spi_slave
    papilio_wb_register
    https://github.com/Papilio-Labs/papilio_wishbone_rgb_led.git

; Additional library directories (for local development)
lib_extra_dirs =
    ../../../dev_wishbone_bus/libs
